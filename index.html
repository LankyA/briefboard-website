<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIEFBOARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


html {
  background: #09090b;
}

body {
  background-color: #09090b;
  color: #efefec;
  font-family: 'IBM Plex Sans', Georgia, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #c0362a, #d4621a, #c8900a, #2a7a3a);
  z-index: 50;
}

.glow {
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: #c0362a;
  opacity: 0.06;
  filter: blur(120px);
  top: -220px; left: -180px;
  pointer-events: none;
  z-index: 0;
}

.glow2 {
  position: fixed;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: #c8900a;
  opacity: 0.05;
  filter: blur(100px);
  bottom: -150px; right: -100px;
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 480px;
  width: 100%;
}

.logo-wrap {
  width: 210px;
  margin-bottom: 3rem;
  opacity: 0;
  animation: up 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) forwards;
}

.logo-wrap svg { width: 100%; height: auto; display: block; }

.tagline {
  font-family: 'IBM Plex Sans', Georgia, serif;
  font-weight: 300;
  font-size: clamp(1rem, 2.4vw, 1.2rem);
  color: #efefec;
  line-height: 1.65;
  margin-bottom: 3rem;
  opacity: 0;
  animation: up 0.8s 0.22s cubic-bezier(0.16,1,0.3,1) forwards;
}

.rule {
  width: 36px;
  height: 1px;
  background: #c8900a;
  margin: 0 auto 3rem;
  opacity: 0;
  animation: up 0.8s 0.32s cubic-bezier(0.16,1,0.3,1) forwards;
}

.cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.6rem;
  opacity: 0;
  animation: up 0.8s 0.42s cubic-bezier(0.16,1,0.3,1) forwards;
}

.cta-text {
  font-family: 'IBM Plex Sans', Georgia, serif;
  font-weight: 400;
  font-size: clamp(0.9rem, 2vw, 1rem);
  color: rgba(239,239,236,0.65);
  line-height: 1.7;
}

.email-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  font-size: clamp(0.78rem, 1.8vw, 0.86rem);
  font-weight: 500;
  letter-spacing: 0.05em;
  text-decoration: none;
  color: #09090b;
  background: #efefec;
  padding: 0.85rem 1.9rem;
  border-radius: 2px;
  overflow: hidden;
  transition: color 0.28s, box-shadow 0.28s;
}

.email-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, #c0362a, #d4621a, #c8900a);
  opacity: 0;
  transition: opacity 0.28s;
}

.email-btn:hover { color: #fff; box-shadow: 0 6px 28px rgba(200,144,10,0.22); }
.email-btn:hover::after { opacity: 1; }

.email-btn span, .email-btn .arr { position: relative; z-index: 1; }
.email-btn .arr { transition: transform 0.22s; }
.email-btn:hover .arr { transform: translateX(4px); }

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #5abf78;
}

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #5abf78;
  animation: blink 2.4s ease-in-out infinite;
}

.footer {
  position: fixed;
  bottom: 1.6rem;
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: rgba(239,239,236,0.2);
  z-index: 1;
  opacity: 0;
  animation: up 0.8s 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

@keyframes up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
